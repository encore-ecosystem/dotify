plugin:
  name: yay
  hooks:
    - hook:
        name: "install"
        args:
          - package
        command: "yay -S {{ package_name }}"
    - hook:
        name: "remove"
        args:
          - package
        command: "yay -R {{ package_name }}"
  setup:
    - procedure: git.clone
      label: "Clonning yay from AUR"
      repo: "https://aur.archlinux.org/yay.git"

    - procedure: shell.command
      label: "cd to yay"
      command: cd
      args: yay

    - procedure: shell.command
      command: makepkg
      args: "-si"
  dependencies:
    - git
    - pacman

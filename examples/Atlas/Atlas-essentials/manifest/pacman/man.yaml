actions:
  - procedure: os.move
    info: "Saving old backup file"
    src: "/etc/pacman.conf.bak"
    dst: "/etc/pacman.conf.backup"
    skip_if_not_exists: true
    privileged: true

  - procedure: os.copy
    info: "Backupping pacman.conf"
    src: "/etc/pacman.conf"
    dst: "/etc/pacman.conf.bak"
    privileged: true

  - procedure: os.remove
    info: "Removing actual pacman.conf"
    src: "/etc/pacman.conf"
    not_exists_ok: true
    privileged: true

  - procedure: os.symlink
    info: "Adding symlink for pacman.conf"
    src: "./files/pacman.conf"
    dst: "/etc/pacman.conf"
    privileged: true

  - procedure: shell.run
    info: "Update system"
    command: pacman
    args: ["-Suy"]
    privileged: true

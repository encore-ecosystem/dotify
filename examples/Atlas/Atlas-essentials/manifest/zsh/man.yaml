actions:
  - procedure: pacman.install
    info: Installing zsh and completions
    packages:
      - "zsh"
      - "zsh-completions"
    skip_condition: zsh --version

  - procedure: os.symlink
    info: Adding symlink to zsh config
    src: "files/.zshrc"
    dst: "{{ user.home }}/.zshrc"

depends:
  - pacman

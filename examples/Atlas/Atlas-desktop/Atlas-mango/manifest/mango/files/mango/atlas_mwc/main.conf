#
# Atlas rice (MangoWC edition)
# v0.0.1
# by Encore Ecosystems
#

# 0. Autostart
source=~/.config/mango/atlas_mwc/autostart.conf

# 1. Monitors
source=~/.config/mango/atlas_mwc/monitors.conf

# 2. Input
source=~/.config/mango/atlas_mwc/input/keyboard.conf
source=~/.config/mango/atlas_mwc/input/mouse.conf
source=~/.config/mango/atlas_mwc/input/trackpad.conf

# 3. Window effect
source=~/.config/mango/atlas_mwc/window.conf

# 4. Annimations
source=~/.config/mango/atlas_mwc/annimations.conf

# 5. Appearance
source=~/.config/mango/atlas_mwc/appearance.conf

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# layer rule
layerrule=animation_type_open:zoom,layer_name:fuzzel
layerrule=animation_type_close:zoom,layer_name:fuzzel

# Env
env=GBM_BACKEND,nvidia-drm
env=QT_IM_MODULES,wayland
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
